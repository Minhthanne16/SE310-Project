services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    # Local development only. minio/minio was removed from Docker Hub; pgsty/minio is a
    # community build of the same server (same command and MINIO_ROOT_* variables).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  mailpit:
    # Hộp thư giả cho local development: nhận mọi email, không gửi ra Internet.
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Storage__Endpoint: minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Bucket: products
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY (at least 32 bytes)}
      Authentication__Jwt__Issuer: se310-api
      Authentication__Jwt__Audience: se310-web
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      # Mặc định gửi vào Mailpit (xem thư tại http://localhost:8025). Đặt SMTP_* trong .env để gửi qua Gmail.
      Email__Host: ${SMTP_HOST:-mailpit}
      Email__Port: ${SMTP_PORT:-1025}
      Email__UseStartTls: ${SMTP_USE_STARTTLS:-false}
      Email__Username: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__From: ${SMTP_FROM:-QLKLTN <no-reply@qlkltn.local>}
      FrontendOrigin: http://localhost:3000
      InitializeDatabase: "true"
      SeedSampleProducts: "true"
      SeedDevelopmentUsers: "true"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:5290:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
